<!doctype html><html><head><style>
html,body{margin:0;background:transparent;overflow:hidden;user-select:none}
.root{position:fixed;inset:0;pointer-events:none}
.hull{position:absolute;width:208px;height:208px;border-radius:50%;pointer-events:none}
.hull[data-active]{pointer-events:auto}
.hit{position:absolute;left:50%;top:50%;width:84px;height:84px;transform:translate(-50%,-50%);margin:0;padding:0;border:0;border-radius:50%;background:transparent;cursor:grab;pointer-events:auto;z-index:2}
.arc{position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;background:#333;color:#fff;border:0;display:none}
.hull[data-active] .arc{display:block}
.composer{position:absolute;left:30px;right:30px;top:40px;height:120px;border-radius:16px;background:#fff;border:2px solid #24c;display:none;font:16px sans-serif;padding:12px;pointer-events:auto}
.root[data-expanded] .composer{display:block}
</style></head><body><div class="root" id="root">
<div class="composer">EXPANDED (clicked)</div>
<div class="hull" id="hull"><button class="arc" style="left:150px;top:150px"></button><button class="hit" id="hit"></button></div></div>
<script>
const { attachPress, ipcRenderer } = require("./press.js");
const root = document.getElementById("root"), hull = document.getElementById("hull"), hit = document.getElementById("hit");
ipcRenderer.on("layout", (_e, l) => { hull.style.left = (l.anchorX - 104) + "px"; hull.style.top = (l.anchorY - 42 - 104) + "px"; });
ipcRenderer.on("activity", (_e, a) => {
  if (a.hovered || a.expanded) hull.dataset.active = "1"; else delete hull.dataset.active;
  if (a.expanded) root.dataset.expanded = "1"; else delete root.dataset.expanded;
});
hull.addEventListener("mouseenter", () => ipcRenderer.send("hover", true));
hull.addEventListener("mouseleave", () => ipcRenderer.send("hover", false));
attachPress(hit, "panel");
</script></body></html>
