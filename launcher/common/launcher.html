<!doctype html>
<!--
  Stella's launcher window, shared by launcher/{linux,macos,windows}. Each
  launcher shows this page in the platform webview (WebKitGTK, WKWebView,
  WebView2) and embeds it in its binary, so it never depends on the checkout
  the launcher may be recovering. Self-contained: fonts are subset woff2
  data URIs (Mona Sans for the wordmark, Manrope for text) and the
  mark is inline SVG. No network, no external files.

  Native -> page: window.stellaLauncher.render(state), where state is
    {
      platform: "linux" | "macos" | "windows",
      phase: "idle" | "starting" | "running" | "stopping" | "failed",
      status: string,        // starting: what is happening now, in plain words
      progress: number,      // starting: 0..1, the part of setup that is done
      progressTo: number,    // starting: 0..1, where the current step ends; the
                             //   bar eases from progress toward it meanwhile
      reason: string,        // failed: one sentence
      output: string[],      // failed: Electron's last lines (Settings > Last error)
      hasKnownGood: boolean, // "Return to last working version" is possible
      version: string        // short HEAD, "" before install
    }
  Any field may be omitted; it keeps its previous value.
  window.stellaLauncher.showSettings(open) opens or closes Settings
  (self-test captures).

  Page -> native: one JSON string per message,
    {"action": "loaded"}      the page can render; show the window now
    {"action": "start"}       idle: start Stella; failed: try again
    {"action": "shutdown"}    running: ask Stella to quit
    {"action": "return"}      return to the last working version, then start
    {"action": "reinstall"}   reinstall, then start
    {"action": "openLogs"}    open the logs folder
    {"action": "close"}       Linux only (undecorated): the close button
    {"action": "drag"}        Linux only: a press on the background; move the window
  through window.webkit.messageHandlers.stella (WebKitGTK, WKWebView) or
  window.chrome.webview (WebView2).
-->

      :root {
        --bg: #fdfdfb;
        --fg: #141413;
        --muted: rgba(20, 20, 19, 0.52);
        --faint: rgba(20, 20, 19, 0.34);
        --hairline: rgba(20, 20, 19, 0.09);
        --ghost: rgba(20, 20, 19, 0.05);
        --ghost-hover: rgba(20, 20, 19, 0.09);
        --primary-bg: #141413;
        --primary-fg: #fdfdfb;
        --primary-hover: #2b2b29;
        --danger: #c8412f;
        --danger-ghost: rgba(200, 65, 47, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f0f0d;
          --fg: #f4f3ee;
          --muted: rgba(244, 243, 238, 0.52);
          --faint: rgba(244, 243, 238, 0.32);
          --hairline: rgba(244, 243, 238, 0.09);
          --ghost: rgba(244, 243, 238, 0.06);
          --ghost-hover: rgba(244, 243, 238, 0.11);
          --primary-bg: #f4f3ee;
          --primary-fg: #0f0f0d;
          --primary-hover: #ffffff;
          --danger: #ef6b58;
          --danger-ghost: rgba(239, 107, 88, 0.12);
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: "Stella Text", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        letter-spacing: -0.005em;
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      button {
        font: inherit;
        color: inherit;
        letter-spacing: inherit;
        border: 0;
        background: none;
        padding: 0;
        cursor: default;
        -webkit-appearance: none;
        appearance: none;
      }
      button:focus {
        outline: none;
      }
      button:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--fg) 35%, transparent);
        outline-offset: 2px;
      }

      .view {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        transition:
          opacity 200ms ease,
          transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .view[hidden] {
        display: flex;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 200ms ease,
          transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1),
          visibility 0s 240ms;
      }
      #home[hidden] {
        transform: translateX(-12px);
      }
      #settings[hidden] {
        transform: translateX(12px);
      }

      #home {
        align-items: center;
        padding: 0 32px 46px;
      }
      .top {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: 18px;
      }
      .brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .mark {
        width: 68px;
        height: 68px;
        color: var(--fg);
      }
      .wordmark {
        font-family: "Stella Display", system-ui, sans-serif;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .reason {
        height: 38px;
        width: 290px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 12.5px;
        line-height: 19px;
        text-align: center;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        opacity: 0;
        transition: opacity 220ms ease;
      }
      body[data-phase="failed"] .reason {
        opacity: 1;
      }

      .bottom {
        position: relative;
        width: 100%;
        height: 106px;
        flex: none;
      }
      .panel {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: 20px 40px 18px;
        row-gap: 14px;
        justify-items: center;
        align-items: center;
        opacity: 0;
        visibility: hidden;
        transform: translateY(4px);
        pointer-events: none;
        transition:
          opacity 220ms ease,
          transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1),
          visibility 0s 260ms;
      }
      .panel > .line {
        grid-row: 1;
      }
      .panel > .control {
        grid-row: 2;
      }
      .panel > .links {
        grid-row: 3;
      }
      body[data-phase="idle"] .panel[data-for~="idle"],
      body[data-phase="starting"] .panel[data-for~="starting"],
      body[data-phase="running"] .panel[data-for~="running"],
      body[data-phase="stopping"] .panel[data-for~="stopping"],
      body[data-phase="failed"] .panel[data-for~="failed"] {
        opacity: 1;
        visibility: visible;
        transform: none;
        pointer-events: auto;
        transition-delay: 0s;
      }

      .pill {
        height: 40px;
        min-width: 0;
        padding: 0 22px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 600;
        transition:
          background 140ms ease,
          transform 120ms ease,
          opacity 140ms ease;
      }
      .pill:active:not(:disabled) {
        transform: scale(0.97);
      }
      .pill.primary {
        background: var(--primary-bg);
        color: var(--primary-fg);
      }
      .pill.primary:hover:not(:disabled) {
        background: var(--primary-hover);
      }
      .pill.ghost {
        background: var(--ghost);
        box-shadow: inset 0 0 0 1px var(--hairline);
      }
      .pill.ghost:hover:not(:disabled) {
        background: var(--ghost-hover);
      }
      .pill:disabled {
        opacity: 0.4;
      }

      .line {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        max-width: 300px;
        height: 20px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
      }
      .line > span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .control.pill {
        width: 220px;
      }
      .bar {
        width: 220px;
        height: 4px;
        border-radius: 999px;
        background: var(--ghost-hover);
        overflow: hidden;
      }
      .bar > div {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: var(--fg);
        transition: width 400ms ease-out;
      }

      .failed-title {
        color: var(--fg);
        font-weight: 600;
      }
      .links {
        display: flex;
        gap: 16px;
      }
      .link {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        transition: color 140ms ease;
      }
      .link:hover {
        color: var(--fg);
      }

      .icon-button {
        position: absolute;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: var(--faint);
        transition:
          color 140ms ease,
          background 140ms ease;
      }
      .icon-button:hover {
        color: var(--fg);
        background: var(--ghost);
      }
      .icon-button svg {
        width: 17px;
        height: 17px;
      }
      #open-settings {
        right: 12px;
        bottom: 12px;
      }
      #close {
        display: none;
        right: 10px;
        top: 10px;
      }
      html[data-platform="linux"] #close {
        display: grid;
      }

      #settings {
        padding: 18px 20px 20px;
      }
      html[data-platform="macos"] #settings {
        padding-top: 38px;
      }
      .settings-head {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 30px;
        margin-bottom: 10px;
      }
      #close-settings {
        position: static;
        margin-left: -6px;
      }
      .settings-title {
        font-size: 14px;
        font-weight: 600;
      }
      .rows {
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        min-height: 0;
        flex: 1;
        margin: 0 -4px;
        padding: 0 4px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 54px;
        padding: 10px 0;
        border-bottom: 1px solid var(--hairline);
      }
      .row:last-child {
        border-bottom: 0;
      }
      .row-text {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .row-label {
        font-size: 13px;
        font-weight: 600;
      }
      .row-hint {
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .value {
        color: var(--muted);
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 12px;
      }
      .pill.small {
        height: 28px;
        min-width: 0;
        min-width: 84px;
        padding: 0 13px;
        font-size: 12px;
        font-weight: 600;
        flex-shrink: 0;
      }
      .pill.danger {
        background: var(--danger-ghost);
        color: var(--danger);
        box-shadow: none;
      }
      .log {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px 0 0;
      }
      .log[hidden] {
        display: none;
      }
      .log pre {
        margin: 0;
        max-height: 150px;
        overflow: auto;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--ghost);
        box-shadow: inset 0 0 0 1px var(--hairline);
        color: var(--muted);
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        -webkit-user-select: text;
        user-select: text;
        cursor: text;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>

          <div class="row-text">
            <div class="row-label">Last working version</div>
            <div class="row-hint" id="return-hint">Go back to the last version that started cleanly.</div>
          </div>
          <button class="pill ghost small" id="return">Return</button>
        </div>
        <div class="row">
          <div class="row-text">
            <div class="row-label">Reinstall</div>
            <div class="row-hint" id="reinstall-hint">Download Stella again. Your data stays.</div>
          </div>
          <button class="pill ghost small" id="reinstall">Reinstall</button>
        </div>
        <div class="log" id="log" hidden>
          <div class="row-label">Last error</div>
          <pre id="output"></pre>
        </div>
      </div>
    </section>

    <button class="icon-button" id="close" title="Close" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M7 7l10 10M17 7L7 17" />
      </svg>
    </button>

    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const state = {
          platform: "",
          phase: "idle",
          status: "",
          progress: 0,
          progressTo: 0,
          reason: "",
          output: [],
          hasKnownGood: false,
          version: "",
        };
        let confirmingReinstall = false;

        let shown = 0;
        let stepFrom = 0;
        let stepTo = 0;
        let stepAt = 0;
        let lastPhase = "";
        const tickBar = () => {
          if (state.phase !== "starting") return;
          const elapsed = (performance.now() - stepAt) / 1000;
          const eased = stepFrom + (stepTo - stepFrom) * 0.9 * (1 - Math.exp(-elapsed / 14));
          shown = Math.min(1, Math.max(shown, stepFrom, eased));
          $("bar").style.width = `${(shown * 100).toFixed(2)}%`;
        };
        setInterval(tickBar, 250);

        const post = (message) => {
          const text = JSON.stringify(message);
          const handlers = window.webkit && window.webkit.messageHandlers;
          if (handlers && handlers.stella) handlers.stella.postMessage(text);
          else if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(text);
        };

        const settingsOpen = () => !$("settings").hidden;
        const showSettings = (open) => {
          $("settings").hidden = !open;
          $("home").hidden = open;
          if (!open) setConfirming(false);
        };

        const setConfirming = (on) => {
          confirmingReinstall = on;
          $("reinstall").textContent = on ? "Confirm" : "Reinstall";
          $("reinstall").classList.toggle("danger", on);
        };

        const render = (next) => {
          Object.assign(state, next || {});
          if (state.platform) document.documentElement.dataset.platform = state.platform;
          document.body.dataset.phase = state.phase;
          const busy = state.phase === "starting" || state.phase === "running" || state.phase === "stopping";

          $("status").textContent = state.status || "Starting Stella…";
          const entering = state.phase === "starting" && lastPhase !== "starting";
          lastPhase = state.phase;
          if (state.phase !== "starting") shown = 0;
          const from = Math.max(0, Math.min(1, Number(state.progress) || 0));
          const to = Math.max(from, Math.min(1, Number(state.progressTo) || from));
          if (entering || from !== stepFrom || to !== stepTo) {
            stepFrom = from;
            stepTo = to;
            stepAt = performance.now();
          }
          tickBar();
          $("reason").textContent = state.reason;
          $("failed-recover").textContent = state.hasKnownGood ? "Return to last working version" : "Reinstall";
          $("version").textContent = state.version || "—";

          $("return").disabled = busy || !state.hasKnownGood;
          $("return-hint").textContent = busy
            ? "Shut Stella down first."
            : state.hasKnownGood
              ? "Go back to the last version that started cleanly."
              : "No working version recorded yet.";
          $("reinstall").disabled = busy;
          $("reinstall-hint").textContent = busy ? "Shut Stella down first." : "Download Stella again. Your data stays.";
          if (busy) setConfirming(false);

          const lines = state.output || [];
          const log = [state.reason, lines.join("\n")].filter(Boolean).join("\n\n");
          $("log").hidden = !log;
          $("output").textContent = log;
        };

        const act = (action) => post({ action });
        $("start").onclick = () => act("start");
        $("retry").onclick = () => act("start");
        $("shutdown").onclick = () => act("shutdown");
        $("failed-recover").onclick = () => act(state.hasKnownGood ? "return" : "reinstall");
        $("failed-details").onclick = () => showSettings(true);
        $("open-settings").onclick = () => showSettings(true);
        $("close-settings").onclick = () => showSettings(false);
        $("open-logs").onclick = () => act("openLogs");
        $("return").onclick = () => {
          showSettings(false);
          act("return");
        };
        $("reinstall").onclick = () => {
          if (!confirmingReinstall) return setConfirming(true);
          showSettings(false);
          act("reinstall");
        };
        $("close").onclick = () => act("close");

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && settingsOpen()) showSettings(false);
          if (event.key === "Enter" && !settingsOpen() && !(event.target instanceof HTMLButtonElement)) {
            const panel = document.querySelector(`.panel[data-for~="${state.phase}"] [data-default]`);
            if (panel) panel.click();
          }
        });
        document.addEventListener("mousedown", (event) => {
          if (state.platform !== "linux" || event.button !== 0) return;
          if (event.target.closest("button, pre")) return;
          act("drag");
        });
        document.addEventListener("contextmenu", (event) => event.preventDefault());

        window.stellaLauncher = { render, showSettings };
        render();
        // Load the fonts before the window shows, so its first frame is the
        // real one. No requestAnimationFrame: a hidden webview never runs it.
        Promise.all([document.fonts.load('600 34px "Stella Display"'), document.fonts.load('600 13px "Stella Text"')])
          .catch(() => {})
          .then(() => act("loaded"));
      })();
    </script>
  </body>
</html>
