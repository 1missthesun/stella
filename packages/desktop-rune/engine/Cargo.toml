[package]
name = "stella-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "stella-engine"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/1missthesun/rune", rev = "3d8eca8b0af399c8bb52ffe839aad42bc22abaa3", features = ["tooling"] }
rune-kit = { git = "https://github.com/1missthesun/rune", rev = "3d8eca8b0af399c8bb52ffe839aad42bc22abaa3", features = ["markdown", "mermaid"] }
rune-notify = { git = "https://github.com/1missthesun/rune", rev = "3d8eca8b0af399c8bb52ffe839aad42bc22abaa3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
wry = { version = "0.58", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "objc2-core-media"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "dispatch2", "SCShareableContent", "SCStream", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.19", optional = true }
webkit2gtk = { version = "3", optional = true, features = ["v2_40"] }

[features]
default = ["webview"]
webview = ["dep:wry", "dep:gtk", "dep:webkit2gtk"]

[patch.crates-io]
wgpu-hal = { git = "https://github.com/1missthesun/rune", rev = "3d8eca8b0af399c8bb52ffe839aad42bc22abaa3" }
naga = { git = "https://github.com/1missthesun/rune", rev = "3d8eca8b0af399c8bb52ffe839aad42bc22abaa3" }
winit = { git = "https://github.com/1missthesun/rune", rev = "3d8eca8b0af399c8bb52ffe839aad42bc22abaa3" }
sctk-adwaita = { git = "https://github.com/1missthesun/rune", rev = "3d8eca8b0af399c8bb52ffe839aad42bc22abaa3" }
parley_engine = { git = "https://github.com/1missthesun/rune", rev = "3d8eca8b0af399c8bb52ffe839aad42bc22abaa3" }
accesskit_windows = { git = "https://github.com/1missthesun/rune", rev = "3d8eca8b0af399c8bb52ffe839aad42bc22abaa3" }
accesskit_atspi_common = { git = "https://github.com/1missthesun/rune", rev = "3d8eca8b0af399c8bb52ffe839aad42bc22abaa3" }
accesskit_macos = { git = "https://github.com/1missthesun/rune", rev = "3d8eca8b0af399c8bb52ffe839aad42bc22abaa3" }

[profile.release]
codegen-units = 16
incremental = true

[profile.dist]
inherits = "release"
codegen-units = 1
incremental = false
lto = "thin"
strip = true

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
