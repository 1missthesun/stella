[package]
name = "stella-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "stella-engine"
path = "src/main.rs"

[dependencies]
rune = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c", features = ["tooling"] }
rune-kit = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c", features = ["markdown", "mermaid"] }
rune-notify = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c" }
rune-fx = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c" }
rune-light = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c" }
wgpu = { version = "~30.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Direct device link (Iroh): ../p2p, shared with the phone engine.
stella-p2p = { path = "../p2p" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
wry = { version = "0.58", optional = true }
# Stella Views: view programs run in PsychoScript live runs (src/views.rs). No GPU canvases here
# (the default `widget-gpu` feature): views draw through Rune.
psychoscript-mobile = { git = "https://github.com/anomalyco/psychoscript", rev = "e289f8ba62aa2b21c19a7ff20e8440c04d3f444c", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAppearance", "NSApplication", "NSDockTile", "NSView", "NSResponder", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics", "objc2-quartz-core"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPath"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "CATransaction", "objc2-core-graphics"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKFrameInfo", "WKNavigationAction", "WKNavigationDelegate", "WKWebView", "WKSnapshotConfiguration"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-audio-types", "objc2-core-video"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "objc2-core-media"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "block2", "dispatch2", "SCShareableContent", "SCStream", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
cpal = "0.15.3"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "adpcm", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
webview2-com = { version = "0.39", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
gtk = { version = "0.19", optional = true }
webkit2gtk = { version = "3", optional = true, features = ["v2_40"] }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", optional = true, features = ["client", "unstable"] }
x11rb = { version = "0.13", optional = true, features = ["randr"] }
gdkx11 = { version = "0.19", optional = true }
x11-dl = { version = "2.21", optional = true }

[features]
default = ["webview"]
webview = ["dep:wry", "dep:webview2-com", "dep:gtk", "dep:webkit2gtk", "dep:wayland-client", "dep:wayland-protocols", "dep:x11rb", "dep:gdkx11", "dep:x11-dl"]

[patch.crates-io]
# wry as published plus `vendor/wry.patch` (IPC from data: and about:blank pages); re-made by `scripts/vendor-wry.sh`.
wry = { path = "vendor/wry" }
wgpu-hal = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c" }
naga = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c" }
winit = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c" }
sctk-adwaita = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c" }
parley_engine = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c" }
accesskit_windows = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c" }
accesskit_atspi_common = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c" }
accesskit_macos = { git = "https://github.com/1missthesun/rune", rev = "0110feabc8c29caebbe07588b5d4b7695d632e0c" }

[profile.release]
codegen-units = 16
incremental = true

[profile.dist]
inherits = "release"
codegen-units = 1
incremental = false
lto = "thin"
strip = true

[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
