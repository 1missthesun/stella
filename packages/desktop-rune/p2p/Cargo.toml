[package]
name = "stella-p2p"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Stella's direct device link: Iroh QUIC between a computer and the devices paired to it, no account or Stella server."

[lib]
path = "src/lib.rs"

[[bin]]
name = "stella-p2p"
path = "src/bin/stella-p2p.rs"
required-features = ["cli"]

[dependencies]
iroh = "1.5"
iroh-mdns-address-lookup = "0.6.1"
tokio = { version = "1.49", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2.10"
getrandom = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
# Iroh's DNS resolver reads Android's system DNS through the app's JNI context; see stella_p2p_android_init.
ndk-context = "0.1.1"

[features]
# A C API (src/ffi.rs) for hosts that aren't Rust: an Expo/RN native module, Swift or Kotlin.
ffi = []
cli = []
