[package]
name = "stella-mobile-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The phone build of Stella's Rune engine: a static library the iOS app links, and a shared
# library (`cargo rustc --crate-type cdylib`, scripts/build-android.sh) the Android app loads. It reuses the desktop engine's tree, props, view, markdown and effect modules as
# they are (src/lib.rs includes them by path) and replaces only what is about windows, native
# text fields and the bridge transport (src/mobile/).
[lib]
name = "stella_mobile_engine"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
rune = { git = "https://github.com/1missthesun/rune", rev = "738cc7897a2d4207e853ab3aa02442b58c1a2bc2", features = ["tooling"] }
rune-kit = { git = "https://github.com/1missthesun/rune", rev = "738cc7897a2d4207e853ab3aa02442b58c1a2bc2", features = ["markdown", "mermaid"] }
rune-fx = { git = "https://github.com/1missthesun/rune", rev = "738cc7897a2d4207e853ab3aa02442b58c1a2bc2" }
rune-light = { git = "https://github.com/1missthesun/rune", rev = "738cc7897a2d4207e853ab3aa02442b58c1a2bc2" }
wgpu = { version = "~30.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Stella Views: view programs run in PsychoScript live runs (the desktop's src/views.rs, included
# by path). No GPU canvases (the default `widget-gpu` feature): views draw through Rune.
psychoscript-mobile = { git = "https://github.com/anomalyco/psychoscript", rev = "e289f8ba62aa2b21c19a7ff20e8440c04d3f444c", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Android app's JNI bridge (src/android.rs). winit is Rune's own (patched below); the engine
# names it only for the NativeActivity entry winit's Android backend links.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
winit = { version = "0.30.13", default-features = false, features = ["android-native-activity"] }

[patch.crates-io]
wgpu-hal = { git = "https://github.com/1missthesun/rune", rev = "738cc7897a2d4207e853ab3aa02442b58c1a2bc2" }
naga = { git = "https://github.com/1missthesun/rune", rev = "738cc7897a2d4207e853ab3aa02442b58c1a2bc2" }
winit = { git = "https://github.com/1missthesun/rune", rev = "738cc7897a2d4207e853ab3aa02442b58c1a2bc2" }
sctk-adwaita = { git = "https://github.com/1missthesun/rune", rev = "738cc7897a2d4207e853ab3aa02442b58c1a2bc2" }
parley_engine = { git = "https://github.com/1missthesun/rune", rev = "738cc7897a2d4207e853ab3aa02442b58c1a2bc2" }
accesskit_windows = { git = "https://github.com/1missthesun/rune", rev = "738cc7897a2d4207e853ab3aa02442b58c1a2bc2" }
accesskit_atspi_common = { git = "https://github.com/1missthesun/rune", rev = "738cc7897a2d4207e853ab3aa02442b58c1a2bc2" }
accesskit_macos = { git = "https://github.com/1missthesun/rune", rev = "738cc7897a2d4207e853ab3aa02442b58c1a2bc2" }

[profile.release]
codegen-units = 16
incremental = true
debug = "line-tables-only"

[profile.dist]
inherits = "release"
codegen-units = 1
incremental = false
lto = "thin"
strip = true
debug = false

[lints.rust]
# The shared desktop modules gate their native webviews on the desktop crate's `webview` feature,
# which this crate never has (the phone opens web pages in its own native views).
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("webview"))'] }
