plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.stella'
version = '1.0.0'

// The device link (crate stella-p2p, cdylib per ABI), built or copied from the per-source cache.
def linkReady = providers.exec {
  commandLine file('../scripts/stella-p2p.sh').absolutePath, 'android'
  ignoreExitValue = true
}
if (linkReady.result.get().exitValue != 0) {
  throw new GradleException("StellaP2p: scripts/stella-p2p.sh android failed:\n" + linkReady.standardError.asText.get())
}

android {
  namespace 'com.stella.p2p'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    consumerProguardFiles 'proguard-rules.pro'
    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
    }
    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_static'
      }
    }
  }
  externalNativeBuild {
    cmake {
      path 'CMakeLists.txt'
    }
  }
  sourceSets {
    main {
      jniLibs.srcDirs += ['vendor/jniLibs']
    }
  }
}
