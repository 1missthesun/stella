[package]
name = "stella_show"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "stella_show"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zune-jpeg = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.24"
core-text = "21.0"

[target.'cfg(target_os = "windows")'.dependencies]
ab_glyph = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
